name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Instalar dependências
        run: composer install --no-interaction --prefer-dist && npm ci
      - name: Preparar aplicação para testes
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan migrate --force
      - name: Verificar PHP e Vue
        run: composer test && npm run types:check
      - name: Build de produção
        run: npm run build
      - name: Verificar módulos locais
        run: npm run test:audio && npm run test:clock && npm run test:draw-storage && npm run test:balanced-draw && npm run test:offline && npm run test:match-queue && npm run test:match-save && npm run test:public-refresh
